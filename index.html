<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="file-actions" class="toolbar-group"></div>
        <div id="group-tabs" class="tabs" role="tablist" aria-label="Grupper"></div>
        <div id="view-actions" class="toolbar-group"></div>
      </header>
      <div id="doc-tabs" class="tabs" role="tablist" aria-label="Dokumenter"></div>
      <nav id="toolbar" aria-label="Verktøy">
        <div id="md-tools" class="toolbar-group"></div>
        <div id="code-tools" class="toolbar-group" hidden></div>
      </nav>
      <div id="workspace">
        <aside id="sidebar">
          <section id="debug" aria-label="Feilsøking" hidden></section>
          <section id="files" aria-label="Filer"></section>
          <section id="outline" aria-label="Disposisjon"></section>
        </aside>
        <div id="main">
          <main id="editor"></main>
          <section id="panel" aria-label="Terminal" hidden></section>
        </div>
      </div>
      <section id="math-panel" class="math-panel" aria-label="Mattepanel" hidden></section>
      <footer id="statusbar">
        <span id="status-save"></span>
        <span class="status-right">
          <span id="status-count"></span>
          <button id="status-version" type="button" hidden></button>
        </span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
