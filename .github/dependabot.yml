# Weekly pull requests for outdated dependencies (NSM 3.1: detect and remove
# known vulnerabilities). Security fixes come as soon as an advisory is out,
# if "Dependabot security updates" is on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
